name: Build and Release APK

on:
  push:
    paths:
      - 'VERSION'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n\r ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub's own cache: the default one is a proprietary component
          # under Gradle's terms of use
          cache-provider: basic

      - name: Android SDK platform
        # The platform the version catalog compiles against, if the runner
        # image lacks it
        run: |
          SDK=$(sed -n 's/^compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MINOR=$(sed -n 's/^compileMinorApi = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-$SDK.$MINOR" > /dev/null

      - name: Set up release signing
        # Every release must carry the same key, or it will not install
        # over the one before: stop rather than sign with a throwaway key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
             || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > key.properties

      - name: Test, lint and build
        # CARTO_KEY switches the map to CARTO tiles; without it the build
        # falls back to OpenStreetMap. GITHUB_RUN_NUMBER sets versionCode.
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: ./gradlew test lint assembleRelease

      - name: Name the APK
        # One universal APK, for every ABI, published under both names the
        # update check of the Flutter releases (4.6.0 and earlier) looks
        # for, so those installs find this one too
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CaliGo-v$V-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-release.apk dist/CaliGo-v$V-armeabi-v7a.apk

      - name: Release notes
        # docs/releases/<version>.md when the version has its own notes
        run: |
          V=${{ steps.version.outputs.version }}
          if [ -f "docs/releases/$V.md" ]; then
            cp "docs/releases/$V.md" release-notes.md
          else
            {
              echo "## CaliGo v$V"
              echo
              echo "### Installation"
              echo "1. Download either APK: both are the same file, under the"
              echo "   two names older versions look for"
              echo "2. Enable \"Install from unknown sources\" on your device"
              echo "3. Install the APK over the previous version; your data stays"
            } > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CaliGo v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/CaliGo-v${{ steps.version.outputs.version }}-arm64-v8a.apk
            dist/CaliGo-v${{ steps.version.outputs.version }}-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
